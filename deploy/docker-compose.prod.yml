services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./miaoxun-prod.env
    ports:
      - "127.0.0.1:4390:4390"
    networks:
      - miaoxun

  ai-task-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: "on-failure:5"
    init: true
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./miaoxun-prod.env
    command: ["node", "src/ai-task-worker.js"]
    environment:
      MIAOXUN_WORKER_HEALTH_PATH: /tmp/miaoxun-ai-task-worker-health.json
    healthcheck:
      test: ["CMD", "node", "src/worker-health.js", "75000"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 2
    networks:
      - miaoxun

  media-retrieval-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: "on-failure:5"
    init: true
    stop_grace_period: 30s
    env_file:
      - ./miaoxun-prod.env
    command: ["node", "src/media-retrieval-worker.js"]
    environment:
      MIAOXUN_WORKER_HEALTH_PATH: /tmp/miaoxun-media-retrieval-worker-health.json
    healthcheck:
      test: ["CMD", "node", "src/worker-health.js", "30000"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 2
    networks:
      - miaoxun

networks:
  miaoxun:
    driver: bridge
