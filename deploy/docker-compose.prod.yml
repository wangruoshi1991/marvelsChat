services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./miaoxun-prod.env
    ports:
      - "127.0.0.1:4390:4390"
    networks:
      - miaoxun

networks:
  miaoxun:
    driver: bridge
