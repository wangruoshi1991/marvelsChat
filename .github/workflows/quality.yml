name: Repository Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            package-lock.json
            MiaoxunRN/package-lock.json
            admin/package-lock.json
            agents/package-lock.json
            avatar-web/package-lock.json
            media-retrieval-web/package-lock.json

      - name: Install repository quality dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install mobile dependencies
        run: npm ci
        working-directory: MiaoxunRN

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Install Agent dependencies
        run: npm ci
        working-directory: agents

      - name: Install avatar Web dependencies
        run: npm ci
        working-directory: avatar-web

      - name: Install media retrieval Web dependencies
        run: npm ci
        working-directory: media-retrieval-web

      - name: Run repository checks
        run: ./scripts/check-repository.sh

  backend-image:
    name: Production backend image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production image
        run: docker build --file backend/Dockerfile --tag miaoxun-backend:quality .

      - name: Verify backend image startup
        run: ./scripts/check-backend-image.sh miaoxun-backend:quality

  migration-replay:
    name: PostgreSQL migration replay
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: miaoxun
          POSTGRES_PASSWORD: miaoxun
          POSTGRES_DB: miaoxun_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miaoxun -d miaoxun_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Replay the ledger-free production upgrade
        run: ./backend/scripts/check-migration-replay.sh
        env:
          DATABASE_URL: postgresql://miaoxun:miaoxun@127.0.0.1:5432/miaoxun_migration_test
          MIAOXUN_DOTENV_ENABLED: "false"

      - name: Prepare an empty migrated database for HTTP integration
        run: |
          createdb --maintenance-db="$REPLAY_DATABASE_URL" miaoxun_http_migration_test
          npm run db:migrate
        working-directory: backend
        env:
          REPLAY_DATABASE_URL: postgresql://miaoxun:miaoxun@127.0.0.1:5432/miaoxun_migration_test
          DATABASE_URL: postgresql://miaoxun:miaoxun@127.0.0.1:5432/miaoxun_http_migration_test
          MIAOXUN_DOTENV_ENABLED: "false"

      - name: Verify Agent publishing and initialize the explicit default Butler fixture
        run: npm run test:agent-publishing
        working-directory: backend
        env:
          DATABASE_URL: postgresql://miaoxun:miaoxun@127.0.0.1:5432/miaoxun_http_migration_test
          MIAOXUN_DOTENV_ENABLED: "false"

      - name: Verify API flows against PostgreSQL
        run: npm run test:api-integration
        working-directory: backend
        env:
          DATABASE_URL: postgresql://miaoxun:miaoxun@127.0.0.1:5432/miaoxun_http_migration_test
          MIAOXUN_DOTENV_ENABLED: "false"

  postgres-regressions:
    name: Isolated PostgreSQL regressions (${{ matrix.suite }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://miaoxun:miaoxun@127.0.0.1:5432/miaoxun_regression_migration_test
      MIAOXUN_DOTENV_ENABLED: "false"
      DEFAULT_ADMIN_ENABLED: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: group-chat
            test: test/group-chat-postgres.test.js
            feature_env: RUN_GROUP_CHAT_POSTGRES
          - suite: chat-message-search
            test: test/chat-message-search-postgres.test.js
            feature_env: RUN_CHAT_MESSAGE_SEARCH_POSTGRES
          - suite: custom-stickers
            test: test/custom-stickers-postgres.test.js
            feature_env: RUN_CUSTOM_STICKERS_POSTGRES
          - suite: ai-task
            test: test/ai-task-integration.test.js
            feature_env: RUN_AI_TASK_INTEGRATION
          - suite: avatar-3d
            test: test/avatar-3d-submission-postgres.test.js
            feature_env: RUN_AVATAR_3D_SUBMISSION_INTEGRATION
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: miaoxun
          POSTGRES_PASSWORD: miaoxun
          POSTGRES_DB: miaoxun_regression_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miaoxun -d miaoxun_regression_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Migrate the disposable database
        run: npm run db:migrate
        working-directory: backend

      - name: Run migrated isolated regression
        run: |
          run_regression() {
            if [[ "$FEATURE_ENV" == RUN_AI_TASK_INTEGRATION ]]; then
              # Publishing fixtures require the server connection itself to use loopback.
              docker run --rm --network "container:$POSTGRES_SERVICE_ID" \
                --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace/backend \
                --env DATABASE_URL --env MIAOXUN_DOTENV_ENABLED --env DEFAULT_ADMIN_ENABLED \
                --env "$FEATURE_ENV=1" --env NODE_ENV=test node:22-bookworm-slim \
                node --test --test-reporter=tap "$TEST_FILE"
            else
              env "$FEATURE_ENV=1" NODE_ENV=test node --test --test-reporter=tap "$TEST_FILE"
            fi
          }
          run_regression | tee "$RUNNER_TEMP/postgres-tests.tap"
          grep -Ex '# pass [1-9][0-9]*' "$RUNNER_TEMP/postgres-tests.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/postgres-tests.tap"
        shell: bash
        working-directory: backend
        env:
          TEST_FILE: ${{ matrix.test }}
          FEATURE_ENV: ${{ matrix.feature_env }}
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}

  android-debug:
    name: Android debug compile
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MiaoxunRN/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install mobile dependencies
        run: npm ci
        working-directory: MiaoxunRN

      - name: Compile Android debug app
        run: ./gradlew assembleDebug --no-daemon
        working-directory: MiaoxunRN/android
        env:
          MIAOXUN_API_BASE_URL: http://10.0.2.2:4390
          MIAOXUN_VERSION_CODE: 45

  avatar-web-e2e:
    name: Web browser end-to-end
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            avatar-web/package-lock.json
            admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: avatar-web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: avatar-web

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: avatar-web

      - name: Build admin for browser tests
        run: |
          npm ci
          npm run build
        working-directory: admin

      - name: Verify admin routes, task operations, profiles and retrieval controls
        run: |
          export PLAYWRIGHT_MODULE="$PWD/avatar-web/node_modules/@playwright/test"
          node admin/test/console-routes.browser.cjs
          node admin/test/monitoring.browser.cjs
          node admin/test/user-confirmation.browser.cjs
          node admin/test/media-retrieval-controls.browser.cjs
          node admin/test/media-retrieval-diagnostics.browser.cjs
