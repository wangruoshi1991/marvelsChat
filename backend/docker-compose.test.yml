services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: marvels_chat_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marvels_chat_test"]
      interval: 2s
      timeout: 3s
      retries: 30
