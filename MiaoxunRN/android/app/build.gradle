apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def releaseStoreFilePath = project.findProperty("MIAOXUN_RELEASE_STORE_FILE") ?: System.getenv("MIAOXUN_RELEASE_STORE_FILE")
def releaseStorePassword = project.findProperty("MIAOXUN_RELEASE_STORE_PASSWORD") ?: System.getenv("MIAOXUN_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = project.findProperty("MIAOXUN_RELEASE_KEY_ALIAS") ?: System.getenv("MIAOXUN_RELEASE_KEY_ALIAS")
def releaseKeyPassword = project.findProperty("MIAOXUN_RELEASE_KEY_PASSWORD") ?: System.getenv("MIAOXUN_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = [releaseStoreFilePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every {
    it != null && !it.toString().trim().isEmpty()
}
def miaoxunVersionCode = (project.findProperty("MIAOXUN_VERSION_CODE") ?: System.getenv("MIAOXUN_VERSION_CODE") ?: "1").toString().toInteger()
def miaoxunVersionName = (project.findProperty("MIAOXUN_VERSION_NAME") ?: System.getenv("MIAOXUN_VERSION_NAME") ?: "1.0").toString()
def miaoxunApiBaseUrl = project.findProperty("MIAOXUN_API_BASE_URL") ?: System.getenv("MIAOXUN_API_BASE_URL")

def isInvalidApiBaseUrl = { value ->
    try {
        def parsed = new URI(value == null ? "" : value.toString().trim())
        !(["http", "https"].contains(parsed.scheme?.toLowerCase())) ||
            parsed.host == null ||
            parsed.userInfo != null ||
            !(parsed.path == null || parsed.path == "" || parsed.path == "/") ||
            parsed.query != null ||
            parsed.fragment != null
    } catch (Exception ignored) {
        true
    }
}

def isUnsafeReleaseApiBaseUrl = { value ->
    def normalized = value == null ? "" : value.toString().trim().toLowerCase()
    isInvalidApiBaseUrl(value) ||
        !normalized.startsWith("https://") ||
        normalized ==~ /^https:\/\/([0-9]{1,3}\.){3}[0-9]{1,3}(:.*|\/.*|$)/ ||
        normalized.contains("localhost") ||
        normalized.contains("127.0.0.1")
}

gradle.taskGraph.whenReady { taskGraph ->
    def requiresReleaseSigning = taskGraph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        name.contains("release") && (name.startsWith("assemble") || name.startsWith("bundle") || name.startsWith("package"))
    }
    if (requiresReleaseSigning && !hasReleaseSigning) {
        throw new GradleException(
            "Release builds require MIAOXUN_RELEASE_STORE_FILE, MIAOXUN_RELEASE_STORE_PASSWORD, " +
            "MIAOXUN_RELEASE_KEY_ALIAS, and MIAOXUN_RELEASE_KEY_PASSWORD."
        )
    }
    if (requiresReleaseSigning && isUnsafeReleaseApiBaseUrl(miaoxunApiBaseUrl)) {
        throw new GradleException(
            "Release builds require MIAOXUN_API_BASE_URL to be an HTTPS domain, not an IP, localhost, or loopback URL."
        )
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.wangruoshi.miaoxun"
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.wangruoshi.miaoxun"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode miaoxunVersionCode
        versionName miaoxunVersionName
        if (miaoxunApiBaseUrl == null || miaoxunApiBaseUrl.trim().isEmpty()) {
            throw new GradleException("MIAOXUN_API_BASE_URL must be provided for Android builds.")
        }
        if (isInvalidApiBaseUrl(miaoxunApiBaseUrl)) {
            throw new GradleException("MIAOXUN_API_BASE_URL must be an HTTP(S) origin without a path.")
        }
        buildConfigField "String", "MIAOXUN_API_BASE_URL", "\"${miaoxunApiBaseUrl}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : null
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.camera:camera-camera2:1.5.1")
    implementation("androidx.camera:camera-lifecycle:1.5.1")
    implementation("androidx.camera:camera-view:1.5.1")
    implementation("androidx.activity:activity:1.13.0")
    implementation("com.google.mlkit:barcode-scanning:17.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
